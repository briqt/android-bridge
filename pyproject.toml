[project]
name = "android-bridge"
dynamic = ["version"]
description = "AI-facing interface for Android device automation via pure ADB"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["android", "adb", "automation", "agent", "cli"]
dependencies = [
    "click==8.5.0",
    "pillow==13.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "build==1.6.1"]

[project.scripts]
android-bridge = "android_bridge.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/android_bridge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/android_bridge"]

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md", "pyproject.toml"]
