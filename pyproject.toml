[project]
name = "android-bridge"
version = "0.2.1"
description = "AI-facing interface for Android device automation via pure ADB"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["android", "adb", "automation", "agent", "cli"]
dependencies = [
    "click>=8.0",
    "pillow>=10.0",
]

[project.scripts]
android-bridge = "android_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/android_bridge"]

[tool.hatch.build.targets.sdist]
include = ["src/"]
